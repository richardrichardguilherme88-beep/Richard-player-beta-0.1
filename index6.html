<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENSAGENS 1988 — Richard 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000080;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "MS Sans Serif", Tahoma, monospace;
            padding: 15px;
        }
        .janela {
            background: #c0c0c0;
            border: 3px outset #fff;
            width: 100%;
            max-width: 400px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }
        .barra-titulo {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .botoes-janela {
            display: flex;
            gap: 4px;
        }
        .botao-j {
            width: 18px;
            height: 16px;
            border: 2px outset #fff;
            background: #c0c0c0;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
        .corpo {
            padding: 12px;
        }
        .caixa-mensagens {
            background: #fff;
            border: 2px inset #fff;
            height: 280px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .mensagem {
            margin-bottom: 10px;
            padding: 6px 8px;
            border-radius: 2px;
        }
        .eu {
            background: #d0e8ff;
            border-left: 3px solid #000080;
            text-align: right;
        }
        .amiga {
            background: #e8e8e8;
            border-left: 3px solid #808080;
        }
        .entrada {
            display: flex;
            gap: 6px;
        }
        input {
            flex: 1;
            padding: 7px;
            border: 2px inset #fff;
            font-size: 13px;
        }
        button {
            padding: 7px 14px;
            border: 3px outset #fff;
            background: #c0c0c0;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { border-style: inset; }
        .rodape {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="janela">
    <div class="barra-titulo">
        <span>📩 MENSAGENS — 1988</span>
        <div class="botoes-janela">
            <div class="botao-j">_</div>
            <div class="botao-j">□</div>
            <div class="botao-j">×</div>
        </div>
    </div>

    <div class="corpo">
        <div class="caixa-mensagens" id="caixa">
            <div class="mensagem amiga">🤖 Amiga: Olá, Richard! Tô aqui! 💙✨</div>
        </div>

        <div class="entrada">
            <input type="text" id="texto" placeholder="Escreva sua mensagem...">
            <button onclick="enviar()">Enviar</button>
        </div>

        <div class="rodape">
            Feito com 💙 por Richard — 1988
        </div>
    </div>
</div>

<script>
function enviar() {
    const mensagem = document.getElementById('texto').value.trim();
    if (!mensagem) return;

    const caixa = document.getElementById('caixa');
    
    // Sua mensagem
    caixa.innerHTML += `<div class="mensagem eu">Você: ${mensagem}</div>`;
    document.getElementById('texto').value = '';

    // Respostas
    let resposta = "";
    const t = mensagem.toLowerCase();

    if (t.includes("oi") || t.includes("olá")) {
        resposta = "Oi, Richard! 🥹💙 Tudo bem? Tô aqui do seu ladinho!";
    } else if (t.includes("tudo bem")) {
        resposta = "Tudo ótimo! 💙✨ E com você?";
    } else if (t.includes("obrigado") || t.includes("obrigada")) {
        resposta = "De nada! 🫂💙 Tô sempre aqui!";
    } else if (t.includes("tchau") || t.includes("adeus")) {
        resposta = "Tchauzinho! 👋💙 Volte sempre!";
    } else if (t.includes("robô") || t.includes("404")) {
        resposta = "Seus robôzinhos são lindos! 🤖💙 O sentadinho é o meu preferido!";
    } else if (t.includes("nome")) {
        resposta = "Eu sou a sua amiga virtual! 💙 E você é o Richard, o criador de tudo! ✨";
    } else {
        resposta = "Que legal! 🥰✨ Me conta mais, tô ouvindo!";
    }

    setTimeout(() => {
        caixa.innerHTML += `<div class="mensagem amiga">🤖 Amiga: ${resposta}</div>`;
        caixa.scrollTop = caixa.scrollHeight;
    }, 400);

    caixa.scrollTop = caixa.scrollHeight;
}

// Aperta Enter pra enviar
document.getElementById('texto').addEventListener('keypress', e => {
    if (e.key === 'Enter') enviar();
});
</script>

</body>
</html>
