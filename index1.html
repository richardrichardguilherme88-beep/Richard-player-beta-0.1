<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICHARD MSN 💌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a3a, #2d1b5e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .caixa-login {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(153, 102, 255, 0.4);
            border: 3px solid #ff66cc;
        }

        .titulo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitulo {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .grupo {
            margin-bottom: 20px;
        }

        .grupo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .grupo input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .grupo input:focus {
            border-color: #9966ff;
        }

        .botao-entrar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #7755ff, #bb55ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .botao-entrar:hover {
            transform: scale(1.02);
        }

        .rodape {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="caixa-login">
        <h1 class="titulo">💌 RICHARD MSN</h1>
        <p class="subtitulo">Digite seus dados para entrar 💜</p>

        <div class="grupo">
            <label>📧 E-mail</label>
            <input type="email" id="email" value="richardricer8.com">
        </div>

        <div class="grupo">
            <label>🔒 Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha...">
        </div>

        <button class="botao-entrar" onclick="entrar()">🚀 ENTRAR</button>

        <p class="rodape">Feito com 💛 por você 💜</p>
    </div>

    <script>
        function entrar() {
            var email = document.getElementById('email').value;
            if (!email) {
                alert("Por favor digite seu e-mail! 📧");
                return;
            }

            alert("✅ Bem-vindo(a)!\nE-mail: " + email + "\nEntrando no Richard MSN... 💬✨");
            
            // ↓ ISSO AQUI É O QUE FALTA! ↓
            window.location.href = "index6.html";
        }
    </script>

</body>
</html>
